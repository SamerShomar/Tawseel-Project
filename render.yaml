# Render Blueprint for the Tawseel API (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: tawseel-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the Neon connection string when creating the service
      - key: CLIENT_URL
        sync: false # the Vercel URL, e.g. https://tawseel.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
